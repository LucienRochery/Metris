name: Nightly regression

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lucienrochery/metris-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Export ESP environment
        run: |
          . /progs/ESP/ESPenv.sh
          echo "ESP_ROOT=${ESP_ROOT}" >> "$GITHUB_ENV"
          echo "CASROOT=${CASROOT}"   >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "${ESP_ROOT}/bin" >> "$GITHUB_PATH"

      # Baselines (one file per hwid and case, see bunit/regression/reg_common.hxx)
      # live in this artifact, re-uploaded each night. The -v2 name starts it
      # fresh: the old regression-baselines artifact holds the old format.
      - name: Download previous baselines
        uses: dawidd6/action-download-artifact@v6
        with:
          name: regression-baselines-v2
          path: regression-baselines/
          workflow: nightly.yml
          branch: main
          # Take the latest run that uploaded baselines, failed or not: the
          # default (last successful run only) would never pick up the first
          # night's baselines, since that night fails for want of a baseline.
          workflow_conclusion: ""
          search_artifacts: true
          if_no_artifact_found: warn

      - name: CMake configure
        run: cmake -B build/release_clang -DCMAKE_BUILD_TYPE=Release -DMETRIS_BUILD_CORES=4

      - name: Run regression tests
        env:
          METRIS_CASES_DIR: ${{ github.workspace }}/examples/
          METRIS_CI_HWID: GitHub_Actions_ubuntu_latest
          METRIS_REG_OUT: ${{ github.workspace }}/regression-out
          METRIS_REG_BASELINE: ${{ github.workspace }}/regression-baselines
          # Runs that pass (or are new) update their baseline.
          METRIS_UPDATE_BASELINE: "1"
          # Shared VMs: CPU time is too noisy to check; still recorded.
          METRIS_REG_SKIP_TIME: "1"
        run: ctest --test-dir build/release_clang --output-on-failure -V -L regression

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-baselines-v2
          path: regression-baselines/
          retention-days: 90
          overwrite: true

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-runs-${{ github.sha }}
          path: |
            regression-out/*.json
            regression-out/**/*.log
          retention-days: 90
