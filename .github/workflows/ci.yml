name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lucienrochery/metris-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ github.ref }}-

      - name: Export ESP environment
        run: |
          . /progs/ESP/ESPenv.sh
          echo "ESP_ROOT=${ESP_ROOT}" >> "$GITHUB_ENV"
          echo "CASROOT=${CASROOT}"   >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "${ESP_ROOT}/bin" >> "$GITHUB_PATH"

      - name: CMake configure
        run: cmake -B build/release_clang -DMETRIS_BUILD_CORES=4

      - name: Build unit tests
        run: cmake --build build/release_clang --target unit_build --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build/release_clang --output-on-failure -V -L unit

      - name: Assert no in-source generated files
        run: |
          count=$(git ls-files --others --exclude-standard | wc -l)
          if [ "$count" -ne 0 ]; then
            git ls-files --others --exclude-standard
            exit 1
          fi
